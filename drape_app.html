
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #drape-root { max-width: 390px; margin: 0 auto; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: 24px; overflow: hidden; min-height: 700px; display: flex; flex-direction: column; font-family: var(--font-sans); }
  .screen { flex: 1; display: flex; flex-direction: column; }
  .top-bar { padding: 18px 16px 12px; border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); }
  .top-bar h1 { font-size: 22px; font-weight: 500; color: #3C3489; letter-spacing: -0.5px; }
  .top-bar p { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
  .search-bar { display: flex; align-items: center; gap: 8px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 8px 12px; margin: 10px 16px 0; }
  .search-bar input { border: none; background: transparent; font-size: 14px; color: var(--color-text-primary); flex: 1; outline: none; }
  .search-bar i { color: var(--color-text-secondary); font-size: 16px; }
  .scroll-area { flex: 1; overflow-y: auto; padding: 16px; }
  .retailer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .retailer-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 16px 12px; cursor: pointer; transition: border-color 0.15s; }
  .retailer-card:hover { border-color: var(--color-border-secondary); }
  .brand-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; margin-bottom: 10px; }
  .brand-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
  .brand-tag { font-size: 11px; color: var(--color-text-secondary); margin-top: 3px; }
  .nav-bar { display: flex; border-top: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0 14px; cursor: pointer; gap: 3px; font-size: 11px; color: var(--color-text-secondary); }
  .nav-item.active { color: #534AB7; }
  .nav-item i { font-size: 20px; }
  .chat-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .chat-header .back-btn { background: none; border: none; cursor: pointer; color: #534AB7; font-size: 20px; padding: 0; }
  .brand-avatar { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; }
  .chat-brand-name { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .chat-brand-sub { font-size: 12px; color: var(--color-text-secondary); }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; }
  .msg.ai { align-self: flex-start; }
  .msg.user { align-self: flex-end; }
  .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
  .msg.ai .msg-bubble { background: var(--color-background-secondary); color: var(--color-text-primary); border-bottom-left-radius: 4px; }
  .msg.user .msg-bubble { background: #534AB7; color: #EEEDFE; border-bottom-right-radius: 4px; }
  .product-row { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; }
  .product-card { min-width: 110px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); overflow: hidden; flex-shrink: 0; }
  .product-img { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .product-info { padding: 6px 8px; }
  .product-name { font-size: 11px; font-weight: 500; color: var(--color-text-primary); }
  .product-price { font-size: 11px; color: var(--color-text-secondary); margin-top: 1px; }
  .product-save { width: 100%; margin-top: 5px; font-size: 11px; padding: 4px 0; background: #EEEDFE; color: #3C3489; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
  .escalate-btn { margin: 0 16px 12px; padding: 10px; border: 0.5px solid #534AB7; border-radius: var(--border-radius-md); background: transparent; color: #534AB7; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .escalate-btn i { font-size: 16px; }
  .chat-input-row { display: flex; gap: 8px; padding: 10px 16px 16px; border-top: 0.5px solid var(--color-border-tertiary); }
  .chat-input-row input { flex: 1; padding: 9px 12px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-secondary); font-size: 14px; color: var(--color-text-primary); outline: none; }
  .send-btn { width: 36px; height: 36px; border-radius: 50%; background: #534AB7; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #EEEDFE; font-size: 16px; flex-shrink: 0; }
  .feed-header { padding: 18px 16px 12px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .feed-header h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  .feed-header p { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
  .feed-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 14px; }
  .outfit-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; }
  .outfit-img { height: 140px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .outfit-info { padding: 8px 10px 10px; }
  .outfit-user { font-size: 12px; font-weight: 500; color: var(--color-text-primary); }
  .outfit-tags { font-size: 11px; color: #534AB7; margin-top: 3px; line-height: 1.4; }
  .outfit-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .outfit-retailer { font-size: 10px; color: var(--color-text-secondary); }
  .like-btn { background: none; border: none; cursor: pointer; color: var(--color-text-secondary); font-size: 15px; display: flex; align-items: center; gap: 3px; font-size: 11px; }
  .like-btn.liked { color: #D4537E; }
  .fab { position: sticky; bottom: 16px; left: 100%; margin-right: 16px; width: 44px; height: 44px; border-radius: 50%; background: #534AB7; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #EEEDFE; font-size: 20px; }
  .escalated-msg { background: #E1F5EE; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #085041; display: flex; align-items: center; gap: 8px; margin: 0 16px 12px; }
  .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
  .typing span { width: 6px; height: 6px; background: var(--color-text-secondary); border-radius: 50%; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Drape — interactive fashion retail app prototype with retailer hub, AI concierge chat, and social outfit feed</h2>

<div id="drape-root">
  <div id="screen-home" class="screen"></div>
  <div id="screen-chat" class="screen" style="display:none"></div>
  <div id="screen-feed" class="screen" style="display:none"></div>
</div>

<script>
const retailers = [
  { id:'velour', name:'Velour', tag:'Contemporary essentials', color:'#EEEDFE', text:'#3C3489', emoji:'V' },
  { id:'crest', name:'Crest & Co', tag:'Tailored classics', color:'#E1F5EE', text:'#085041', emoji:'C' },
  { id:'nordly', name:'Nordly', tag:'Scandi minimalism', color:'#FBEAF0', text:'#72243E', emoji:'N' },
  { id:'harlo', name:'Harlo', tag:'Street & sport', color:'#FAEEDA', text:'#633806', emoji:'H' },
  { id:'mave', name:'Mave Studio', tag:'Premium capsule', color:'#F1EFE8', text:'#444441', emoji:'M' },
  { id:'auric', name:'Auric', tag:'Luxe occasionwear', color:'#E6F1FB', text:'#0C447C', emoji:'A' },
];

const outfits = [
  { user:'@sofiaq', tags:'#minimalist #workwear', retailer:'Velour', emoji:'👗', bg:'#EEEDFE', likes:42 },
  { user:'@tomk', tags:'#streetwear #casual', retailer:'Harlo', emoji:'🧥', bg:'#FAEEDA', likes:18 },
  { user:'@priyam', tags:'#eveningwear #chic', retailer:'Auric', emoji:'👠', bg:'#E6F1FB', likes:87 },
  { user:'@ellab', tags:'#scandi #neutral', retailer:'Nordly', emoji:'🧣', bg:'#FBEAF0', likes:31 },
  { user:'@jakef', tags:'#tailored #smart', retailer:'Crest & Co', emoji:'👔', bg:'#E1F5EE', likes:55 },
  { user:'@lunam', tags:'#capsule #mono', retailer:'Mave Studio', emoji:'🧤', bg:'#F1EFE8', likes:23 },
];

let currentTab = 'home';
let likedOutfits = new Set();
let chatState = {};

function navBar(active) {
  return `<div class="nav-bar">
    <div class="nav-item ${active==='home'?'active':''}" onclick="switchTab('home')"><i class="ti ti-home" aria-hidden="true"></i>Home</div>
    <div class="nav-item ${active==='feed'?'active':''}" onclick="switchTab('feed')"><i class="ti ti-layout-grid" aria-hidden="true"></i>Feed</div>
    <div class="nav-item" onclick=""><i class="ti ti-user" aria-hidden="true"></i>Profile</div>
  </div>`;
}

function renderHome() {
  const cards = retailers.map(r => `
    <div class="retailer-card" onclick="openChat('${r.id}')">
      <div class="brand-icon" style="background:${r.color}; color:${r.text}">${r.emoji}</div>
      <div class="brand-name">${r.name}</div>
      <div class="brand-tag">${r.tag}</div>
    </div>`).join('');
  document.getElementById('screen-home').innerHTML = `
    <div class="top-bar">
      <h1>Drape</h1>
      <p>Your fashion world, one place</p>
    </div>
    <div class="search-bar">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input placeholder="Search retailers, styles, brands..." />
    </div>
    <div class="scroll-area"><div class="retailer-grid">${cards}</div></div>
    ${navBar('home')}`;
}

function openChat(retailerId) {
  const r = retailers.find(x => x.id === retailerId);
  if (!chatState[retailerId]) {
    chatState[retailerId] = [
      { role:'ai', text:`Hi, I'm ${r.name}'s style assistant! I'm here to help you find pieces you'll love. What are you looking for today — something casual, a work look, or a special occasion?` }
    ];
  }
  document.getElementById('screen-home').style.display = 'none';
  document.getElementById('screen-chat').style.display = 'flex';
  renderChat(r);
}

function renderChat(r) {
  const msgs = chatState[r.id];
  const bubbles = msgs.map(m => {
    if (m.role === 'ai') {
      let products = '';
      if (m.products) {
        products = `<div class="product-row">${m.products.map(p => `
          <div class="product-card">
            <div class="product-img" style="background:${r.color}">${p.emoji}</div>
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">${p.price}</div>
              <button class="product-save">Save</button>
            </div>
          </div>`).join('')}</div>`;
      }
      return `<div class="msg ai"><div class="msg-bubble">${m.text}</div>${products}</div>`;
    } else {
      return `<div class="msg user"><div class="msg-bubble">${m.text}</div></div>`;
    }
  }).join('');

  const escalated = chatState[r.id + '_escalated'];
  const escalateSection = escalated
    ? `<div class="escalated-msg"><i class="ti ti-user-check" aria-hidden="true"></i> Connecting you to a ${r.name} stylist — they'll have your full conversation history.</div>`
    : `<button class="escalate-btn" onclick="escalate('${r.id}')"><i class="ti ti-headset" aria-hidden="true"></i>Talk to a ${r.name} stylist</button>`;

  document.getElementById('screen-chat').innerHTML = `
    <div class="chat-header">
      <button class="back-btn" onclick="goHome()" aria-label="Back"><i class="ti ti-arrow-left"></i></button>
      <div class="brand-avatar" style="background:${r.color}; color:${r.text}">${r.emoji}</div>
      <div>
        <div class="chat-brand-name">${r.name}</div>
        <div class="chat-brand-sub">AI style assistant</div>
      </div>
    </div>
    <div class="messages" id="msg-area">${bubbles}</div>
    ${escalateSection}
    <div class="chat-input-row">
      <input id="chat-input" placeholder="Ask your concierge..." onkeydown="if(event.key==='Enter')sendMsg('${r.id}')" />
      <button class="send-btn" onclick="sendMsg('${r.id}')" aria-label="Send"><i class="ti ti-send"></i></button>
    </div>`;
  scrollMsgs();
}

const aiReplies = [
  { text:"Great choice! Based on your style, here are a few pieces I'd recommend:", products:[
    { name:'Silk blend blazer', price:'£189', emoji:'🧥' },
    { name:'Wide-leg trousers', price:'£95', emoji:'👖' },
    { name:'Merino knit', price:'£75', emoji:'🧶' }
  ]},
  { text:"Love that vibe! These would work perfectly together — very clean and effortless:", products:[
    { name:'Linen shirt', price:'£65', emoji:'👕' },
    { name:'Tailored shorts', price:'£79', emoji:'🩳' },
    { name:'Canvas tote', price:'£45', emoji:'👜' }
  ]},
  { text:"For that occasion I'd suggest something elevated but comfortable. Here are my top picks:", products:[
    { name:'Slip dress', price:'£145', emoji:'👗' },
    { name:'Strappy heels', price:'£120', emoji:'👠' },
    { name:'Gold clutch', price:'£89', emoji:'👛' }
  ]},
];
let replyIndex = 0;

function sendMsg(retailerId) {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const r = retailers.find(x => x.id === retailerId);
  chatState[retailerId].push({ role:'user', text });

  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg ai';
  typingDiv.id = 'typing-indicator';
  typingDiv.innerHTML = `<div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  document.getElementById('msg-area').appendChild(typingDiv);
  scrollMsgs();

  setTimeout(() => {
    const reply = aiReplies[replyIndex % aiReplies.length];
    replyIndex++;
    chatState[retailerId].push({ role:'ai', text: reply.text, products: reply.products });
    renderChat(r);
    scrollMsgs();
  }, 1200);
}

function escalate(retailerId) {
  chatState[retailerId + '_escalated'] = true;
  const r = retailers.find(x => x.id === retailerId);
  renderChat(r);
}

function scrollMsgs() {
  const area = document.getElementById('msg-area');
  if (area) area.scrollTop = area.scrollHeight;
}

function goHome() {
  document.getElementById('screen-chat').style.display = 'none';
  document.getElementById('screen-home').style.display = 'flex';
}

function renderFeed() {
  const cards = outfits.map((o, i) => {
    const liked = likedOutfits.has(i);
    return `<div class="outfit-card">
      <div class="outfit-img" style="background:${o.bg}">${o.emoji}</div>
      <div class="outfit-info">
        <div class="outfit-user">${o.user}</div>
        <div class="outfit-tags">${o.tags}</div>
        <div class="outfit-footer">
          <div class="outfit-retailer">${o.retailer}</div>
          <button class="like-btn ${liked?'liked':''}" onclick="toggleLike(${i})">
            <i class="ti ti-heart" aria-hidden="true"></i> ${liked ? o.likes+1 : o.likes}
          </button>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('screen-feed').innerHTML = `
    <div class="feed-header">
      <h2>Style feed</h2>
      <p>See what the community is wearing</p>
    </div>
    <div class="scroll-area">
      <div class="feed-grid">${cards}</div>
      <div style="text-align:center; padding: 8px 0 4px;">
        <button class="fab" aria-label="Post outfit"><i class="ti ti-plus"></i></button>
      </div>
    </div>
    ${navBar('feed')}`;
}

function toggleLike(i) {
  if (likedOutfits.has(i)) likedOutfits.delete(i);
  else likedOutfits.add(i);
  renderFeed();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('screen-home').style.display = tab==='home' ? 'flex' : 'none';
  document.getElementById('screen-feed').style.display = tab==='feed' ? 'flex' : 'none';
  document.getElementById('screen-chat').style.display = 'none';
  if (tab==='feed') renderFeed();
  if (tab==='home') renderHome();
}

renderHome();
</script>
